services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    ports:
      - '5432:5432'

  app:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: